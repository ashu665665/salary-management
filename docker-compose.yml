services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
