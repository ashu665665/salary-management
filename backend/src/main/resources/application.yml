spring:
  application:
    name: salary-management
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salary}
    username: ${DATABASE_USER:salary}
    password: ${DATABASE_PASSWORD:salary}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  seed:
    # Fills an empty database with a small demo organisation. Never touches existing data unless
    # reset is asked for. Set employee-count higher for a full-sized organisation.
    enabled: ${SEED_ENABLED:true}
    reset: ${SEED_RESET:false}
    employee-count: ${SEED_EMPLOYEE_COUNT:25}
    random-seed: ${SEED_RANDOM_SEED:20250601}
