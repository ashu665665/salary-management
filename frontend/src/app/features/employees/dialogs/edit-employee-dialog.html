<h2 mat-dialog-title>Edit {{ employee.employeeCode }}</h2>

<mat-dialog-content class="form">
  <mat-form-field appearance="outline">
    <mat-label>First name</mat-label>
    <input matInput [value]="firstName()" (input)="firstName.set($any($event.target).value)" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Last name</mat-label>
    <input matInput [value]="lastName()" (input)="lastName.set($any($event.target).value)" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" [value]="email()" (input)="email.set($any($event.target).value)" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Department</mat-label>
    <mat-select [value]="department()" (selectionChange)="department.set($event.value)">
      @for (option of departments; track option) {
        <mat-option [value]="option">{{ option | enumLabel }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button mat-flat-button type="button" [disabled]="!canSave()" (click)="save()">
    {{ saving() ? 'Saving…' : 'Save details' }}
  </button>
</mat-dialog-actions>
